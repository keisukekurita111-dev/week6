<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>BMI計算ツール</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">BMI計算ツール</h1>

        <div class="mb-4">
            <label for="height" class="block mb-2">身長（cm）</label>
            <input
                type="number"
                id="height"
                class="w-full border rounded p-2"
                placeholder="例：170"
            >
        </div>

        <div class="mb-4">
            <label for="weight" class="block mb-2">体重（kg）</label>
            <input
                type="number"
                id="weight"
                class="w-full border rounded p-2"
                placeholder="例：60"
            >
        </div>

        <button
            id="calculateBtn"
            class="w-full bg-blue-500 text-white py-2 rounded"
        >
            計算する
        </button>

        <div id="result" class="mt-6 text-center"></div>
    </div>

    <script>
        const heightInput = document.querySelector("#height");
        const weightInput = document.querySelector("#weight");
        const calculateBtn = document.querySelector("#calculateBtn");
        const result = document.querySelector("#result");

        calculateBtn.addEventListener("click", () => {
            const height = Number(heightInput.value);
            const weight = Number(weightInput.value);

            if (height <= 0 || weight <= 0) {
                result.textContent = "身長と体重に0より大きい数値を入力してください。";
                return;
            }

            const heightInMeter = height / 100;
            const bmi = weight / (heightInMeter ** 2);

            let judgment;

            if (bmi < 18.5) {
                judgment = "痩せ型";
            } else if (bmi < 25) {
                judgment = "普通";
            } else {
                judgment = "肥満";
            }

            result.textContent = `BMI：${bmi.toFixed(1)}　判定：${judgment}`;
        });
    </script>
</body>
</html>
